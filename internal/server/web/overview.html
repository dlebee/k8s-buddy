<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k8s-buddy</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <svg viewBox="0 0 100 116" class="brand-mark" aria-hidden="true">
      <path fill="#326ce5" d="M50 12 C78 12 92 32 92 58 L92 98 Q85 92 78 98 Q71 104 64 98 Q57 92 50 98 Q43 104 36 98 Q29 92 22 98 Q15 104 8 98 L8 58 C8 32 22 12 50 12 Z"/>
      <ellipse cx="36" cy="46" rx="8" ry="9" fill="#fff"/><circle cx="37" cy="47" r="3.4" fill="#1c1c1e"/>
      <ellipse cx="64" cy="46" rx="8" ry="9" fill="#fff"/><circle cx="63" cy="47" r="3.4" fill="#1c1c1e"/>
      <g stroke="#fff" stroke-width="2.6" fill="none"><circle cx="50" cy="76" r="9"/><path d="M50 64 V88 M39.6 70 L60.4 82 M39.6 82 L60.4 70"/></g>
    </svg>
    <div><b>k8s-buddy</b><small id="brandSub">watching your clusters</small></div>
  </div>
  <nav id="nav">
    <a data-view="overview"><span class="ico">◎</span>Overview</a>
    <a data-view="resources"><span class="ico">▦</span>Resources</a>
    <div id="subnav" class="subnav" hidden></div>
    <a data-view="alerts"><span class="ico">◔</span>Alerts<span class="count" id="navAlerts"></span></a>
    <a data-view="history"><span class="ico">↺</span>History</a>
    <a data-view="doctor"><span class="ico">✚</span>Doctor<span class="count neutral" id="navDoctor"></span></a>
  </nav>
  <div class="sidebar-resize" id="sbResize" title="Drag to resize · double-click to reset"></div>
  <nav class="bottom">
    <a data-view="settings"><span class="ico">⚙</span>Settings</a>
  </nav>
</aside>
<main id="view"></main>
<div id="drawer" class="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <section class="drawer-panel">
    <header class="drawer-head">
      <div>
        <div class="eyebrow" id="dEyebrow"></div>
        <h2 id="dTitle"></h2>
      </div>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </header>
    <div class="tabs" id="dTabs"></div>
    <div class="drawer-body" id="dBody"></div>
  </section>
</div>
<div id="toast" class="toast"></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
