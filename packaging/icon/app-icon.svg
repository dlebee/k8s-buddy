<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS app icon: a rounded tile (824 px on the 1024 grid) with the k8s-buddy mascot. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#cfdcfb"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2459d6"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1a40" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <ellipse cx="512" cy="812" rx="170" ry="24" fill="#1c2b5a" opacity=".18" filter="url(#soft)"/>
  <g transform="translate(252 198) scale(5.2)">
    <line x1="50" y1="14" x2="50" y2="4" stroke="#2459d6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="4" r="4" fill="#ffd60a"/>
    <path fill="url(#body)" d="M50 12 C78 12 92 32 92 58 L92 98 Q85 92 78 98 Q71 104 64 98 Q57 92 50 98 Q43 104 36 98 Q29 92 22 98 Q15 104 8 98 L8 58 C8 32 22 12 50 12 Z"/>
    <ellipse cx="36" cy="26" rx="12" ry="6" fill="#fff" opacity=".18"/>
    <ellipse cx="36" cy="46" rx="8" ry="9" fill="#fff"/><circle cx="37" cy="47" r="3.4" fill="#1c1c1e"/>
    <ellipse cx="64" cy="46" rx="8" ry="9" fill="#fff"/><circle cx="63" cy="47" r="3.4" fill="#1c1c1e"/>
    <ellipse cx="26" cy="58" rx="5" ry="3" fill="#ff8fa3" opacity=".55"/>
    <ellipse cx="74" cy="58" rx="5" ry="3" fill="#ff8fa3" opacity=".55"/>
    <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none">
      <circle cx="50" cy="76" r="9"/><circle cx="50" cy="76" r="2.4" fill="#fff"/>
      <path d="M50 64 V88 M39.6 70 L60.4 82 M39.6 82 L60.4 70"/>
    </g>
  </g>
