name: cla
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action only reads PR metadata and comments; it never checks out or runs PR code.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# One signature write at a time: concurrent runs would race on signatures/cla.json.
concurrency:
  group: cla
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/dlebee/k8s-buddy/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dlebee,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for contributing to k8s-buddy! Before we can merge, please sign our
            [Contributor License Agreement](https://github.com/dlebee/k8s-buddy/blob/main/CLA.md)
            by replying to this pull request with the sentence below. You only need to do this once.
