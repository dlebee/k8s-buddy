name: vulncheck

# Known Go vulnerabilities in code k8s-buddy actually calls fail this check. It also runs weekly,
# since advisories appear without any change here.
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod, cache: false}
      # Pinned version; the module checksum database verifies what is downloaded.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
