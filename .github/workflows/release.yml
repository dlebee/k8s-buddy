name: release

# Pushing a tag like v0.2.0 builds, signs and publishes release 0.2.0. Nothing else releases.
# Signing steps skip themselves until their secrets/variables exist, so unsigned releases still work.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # Azure OIDC for Windows signing

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not a version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          [[ "$TAG" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod, cache: false}
      - run: go vet ./... && go test ./...

  macos:
    name: macOS (sign + notarize)
    runs-on: macos-latest
    needs: [version, test]
    environment: release # signing secrets live in this environment, readable only by release jobs
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      AC_TEAM_ID: ${{ vars.AC_TEAM_ID }}
      # Only says whether signing is configured; the secret itself is passed to the steps that use it.
      SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      NOTARIZING: ${{ secrets.AC_APPLE_ID != '' && secrets.AC_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod, cache: false}

      - name: Build universal app
        run: packaging/macos/build-app.sh "$VERSION" build

      - name: Import Developer ID certificate into a temporary keychain
        if: env.SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Codesign the app (hardened runtime)
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" build/k8s-buddy.app
          codesign --verify --strict --deep --verbose=2 build/k8s-buddy.app

      - name: Notarize and staple the app
        if: env.SIGNING == 'true' && env.NOTARIZING == 'true'
        env:
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_APP_PASSWORD: ${{ secrets.AC_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/k8s-buddy.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$AC_APPLE_ID" \
            --password "$AC_APP_PASSWORD" --team-id "$AC_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple build/k8s-buddy.app

      - name: Build DMG and zip
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/dmg"
          ditto build/k8s-buddy.app "$RUNNER_TEMP/dmg/k8s-buddy.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "k8s-buddy" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov \
            "dist/k8s-buddy-$VERSION-macos-universal.dmg"
          ditto -c -k --keepParent build/k8s-buddy.app "dist/k8s-buddy-$VERSION-macos-universal.zip"

      - name: Sign, notarize and staple the DMG
        if: env.SIGNING == 'true'
        env:
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_APP_PASSWORD: ${{ secrets.AC_APP_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/k8s-buddy-$VERSION-macos-universal.dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG"
          if [ -n "$AC_APPLE_ID" ] && [ -n "$AC_APP_PASSWORD" ]; then
            xcrun notarytool submit "$DMG" --apple-id "$AC_APPLE_ID" --password "$AC_APP_PASSWORD" \
              --team-id "$AC_TEAM_ID" --wait --timeout 30m
            xcrun stapler staple "$DMG"
            spctl --assess --type open --context context:primary-signature -vv "$DMG"
          fi

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: macos, path: dist/*, if-no-files-found: error}

  windows:
    name: Windows (Trusted Signing)
    runs-on: windows-latest
    needs: [version, test]
    environment: release # the Azure federated credential trusts this environment
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod, cache: false}

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in 'amd64', 'arm64') {
            $env:GOOS = 'windows'; $env:GOARCH = $arch; $env:CGO_ENABLED = '0'
            # windowsgui: no console window pops up when launched from the Start menu or at login.
            go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$env:VERSION" -o "build/$arch/k8s-buddy.exe" ./cmd/k8s-buddy
            if ($LASTEXITCODE -ne 0) { throw "build failed for $arch" }
          }

      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install SignTool and the Trusted Signing dlib
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'microsoft.artifactsigning.client'; $ver = '1.0.128'
          $out = Join-Path $env:RUNNER_TEMP 'acs'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zip = Join-Path $out 'client.zip'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$pkg/$ver/$pkg.$ver.nupkg" -OutFile $zip
          # Pinned: this DLL is loaded into signtool while the Azure signing token is live.
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B') { throw 'Trusted Signing client hash mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $out 'pkg') -Force
          $dlib = Get-ChildItem (Join-Path $out 'pkg') -Filter Azure.CodeSigning.Dlib.dll -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dlib) { throw 'Azure.CodeSigning.Dlib.dll (x64) not found' }
          $meta = Join-Path $out 'metadata.json'
          @{ Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT.TrimEnd('/'); CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT;
             CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE } | ConvertTo-Json | Set-Content $meta -Encoding utf8
          $signtool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          "ACS_DLIB=$dlib", "ACS_METADATA=$meta", "SIGNTOOL=$signtool" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign executables
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          foreach ($arch in 'amd64', 'arm64') { & ./packaging/windows/sign-file.ps1 "build/$arch/k8s-buddy.exe" }

      - name: Build MSIs
        shell: pwsh
        run: |
          foreach ($pair in @(@('amd64', 'x64'), @('arm64', 'arm64'))) {
            & ./packaging/windows/build-msi.ps1 -Version $env:VERSION -Arch $pair[1] -BinDir "build/$($pair[0])" `
              -Out "dist/k8s-buddy-$env:VERSION-windows-$($pair[1]).msi"
          }

      - name: Sign MSIs
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem dist -Filter *.msi) { & ./packaging/windows/sign-file.ps1 $msi.FullName }

      - name: Package zips
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in 'amd64', 'arm64') {
            Copy-Item LICENSE, NOTICE, README.md "build/$arch/" -Force
            Compress-Archive -Path "build/$arch/*" -DestinationPath "dist/k8s-buddy-$env:VERSION-windows-$arch.zip"
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: windows, path: dist/*, if-no-files-found: error}

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: [version, test]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod, cache: false}
      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            dir="build/k8s-buddy-$VERSION-linux-$arch"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$dir/k8s-buddy" ./cmd/k8s-buddy
            cp LICENSE NOTICE README.md "$dir/"
            tar -C build -czf "dist/k8s-buddy-$VERSION-linux-$arch.tar.gz" "$(basename "$dir")"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: linux, path: dist/*, if-no-files-found: error}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, macos, windows, linux]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {path: dist, merge-multiple: true}
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: k8s-buddy ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
